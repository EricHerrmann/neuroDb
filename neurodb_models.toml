# NeuroDb model routing configuration.
# Maps capability tiers to providers/models and task types to tiers.
# Update model IDs here when new generations are released.
# To change active providers, edit [routing] below — no env vars needed.

[routing]
economy  = "groq"
standard = "groq"
premium  = "groq"

[tiers.economy]

[tiers.economy.providers.anthropic]
model = "claude-haiku-4-5-20251001"
eval_status = "baseline"
last_verified_at = "2026-05-08"

