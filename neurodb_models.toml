# NeuroDb model routing configuration.
# Maps capability tiers to providers/models and task types to tiers.
# Update model IDs here when new generations are released.

[tiers.economy]
default_provider = "anthropic"

[tiers.economy.providers.anthropic]
model = "claude-haiku-4-5-20251001"
eval_status = "baseline"
last_verified_at = "2026-05-08"

[tiers.standard]
default_provider = "anthropic"

[tiers.standard.providers.anthropic]
model = "claude-sonnet-4-6"
eval_status = "baseline"
last_verified_at = "2026-05-08"

[tiers.premium]
default_provider = "anthropic"

[tiers.premium.providers.anthropic]
model = "claude-opus-4-7"
eval_status = "baseline"
last_verified_at = "2026-05-08"

# Task types → tier + max_tokens
# task_type keys must match the telemetry_task_type values used in agents

[tasks."summary.session"]
tier = "economy"
max_tokens = 512

[tasks."summary.knowledge"]
tier = "economy"
max_tokens = 512

[tasks."agent.loop.local_db"]
tier = "standard"
max_tokens = 2048

[tasks."agent.loop.external_db"]
tier = "standard"
max_tokens = 2048

[tasks."agent.loop.neuro_tutor"]
tier = "standard"
max_tokens = 2048

[tasks."agent.loop.neuro_research"]
tier = "standard"
max_tokens = 4096

[tasks."agent.loop.research"]
tier = "standard"
max_tokens = 2048

[tasks."agent.loop.unknown"]
tier = "standard"
max_tokens = 2048

[tasks."research.hypothesis_review"]
tier = "premium"
max_tokens = 4096
