[project]
name = "neurodb"
version = "0.1.0"
description = "Local reproducible neuroscience data platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.8,<2.0",
    "dandi>=0.62,<1.0",
    "duckdb>=1.2,<2.0",
    "duckdb-engine>=0.14,<1.0",
    "h5py>=3.10,<4.0",
    "httpx>=0.28.1,<1.0",
    "pandas>=3.0.2,<4.0",
    "pynwb>=2.8,<4.0",
    "sentence-transformers>=5.4.1,<6.0",
    "sqlalchemy>=2.0.49,<3.0",
    "anthropic>=0.50.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "streamlit>=1.56.0,<2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurodb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/neurodb --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
omit = ["src/neurodb/ui/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
